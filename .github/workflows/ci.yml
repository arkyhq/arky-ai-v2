name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Compile every Python file
        run: python -m compileall -q .

      - name: Run deterministic self-tests
        run: |
          python scripts/creator_voice/voice_mapper.py
          python scripts/creator_voice/voice_validator.py
          python scripts/creator_voice/voice_transformer.py
          python scripts/creator_voice/voice_output_validator.py
          python scripts/creator_voice/creator_voice_engine.py
          python scripts/visual_planning/visual_constitution.py
          python scripts/visual_planning/visual_mapper.py
          python scripts/visual_planning/visual_validator.py
          python scripts/visual_planning/visual_planner.py
          python scripts/visual_planning/visual_output_validator.py
          python scripts/visual_planning/visual_planning_engine.py

      - name: Run integration tests
        run: pytest

      - name: Run linting
        run: ruff check .
